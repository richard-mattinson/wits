<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- style sheet -->
    <link rel="stylesheet" type="text/css" href="index_styles.css">
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <!-- bootstrap icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">   
    <!-- bootstrap css and js -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"> -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script> -->
    <!-- flag-icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"/>
    <!-- google image search -->
    <script src="https://www.google.com/jsapi"></script>
    <!-- my js script -->
    <script src="index_script.js" defer></script>
</head>
<body>

    <div id="fixed_bar">
        <div id="navbar" class="grey">
            <h1 id="title_text">WITS Grade Tracker</h1>
        </div>
    </div>

    <div id="body_container">

        <div id="film_1_title_container" class="film_title_container">
            <div id="film_1_title" class="film_title">Revenge</div>
            <div id="film_1_grade" class="film_grade">n/a</div>
        </div>

        <div id="film_1_a_container" class="film_counter_container">
            <div class="grade_label">Grade A</div>
            <button id="minus_film_1_a" class="minus_button"><i class="bi bi-dash minus_icon"></i></button>
            <div id="counter_film_1_a" class="counter">00</div>
            <button id="plus_film_1_a" class="plus_button"><i class="bi bi-plus-lg plus_icon"></i></button>
        </div>

        <div id="film_1_b_container" class="film_counter_container">
            <div class="grade_label">Grade B</div>
            <button id="minus_film_1_b" class="minus_button"><i class="bi bi-dash minus_icon"></i></button>
            <div id="counter_film_1_b" class="counter">00</div>
            <button id="plus_film_1_b" class="plus_button"><i class="bi bi-plus-lg plus_icon"></i></button>
        </div>

        <div id="film_1_c_container" class="film_counter_container">
            <div class="grade_label">Grade B</div>
            <button id="minus_film_1_c" class="minus_button"><i class="bi bi-dash minus_icon"></i></button>
            <div id="counter_film_1_c" class="counter">00</div>
            <button id="plus_film_1_c" class="plus_button"><i class="bi bi-plus-lg plus_icon"></i></button>
        </div>

    </div>

</body>
</html>
